# Host/SDL build to compile-test and run the offline tide component on a PC.
#   esphome compile host_test.yaml     # verify it builds
#   esphome run host_test.yaml         # run locally (SNTP will sync real time)
#
# station_data below is the generated string for NOAA 8452944 (Conimicut Light).
# Regenerate with: python ../generator/generate_station.py --id <id>

esphome:
  name: tide-host-test

host:

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [tide]
  - source:
      type: local
      path: test_components
    components: [host_time]

time:
  - platform: host_time
    id: system_time
    timezone: America/New_York

tide:
  id: my_tide
  time_id: system_time
  units: ft
  update_interval: 10s
  station_data: "TIDE1|U=m|Z0=0.6420|D=MLLW|MHW=1.3220|MLW=0.0520|M2:0.576:7.6|S2:0.123:31|N2:0.14:351.7|K1:0.065:170.7|M4:0.089:56.2|O1:0.05:201.1|M6:0.017:301.9|MK3:0.011:29.7|S4:0.011:29|MN4:0.04:7.8|NU2:0.024:350|S6:0.002:299.1|MU2:0.028:355.8|2N2:0.021:336.7|OO1:0.005:198.7|LAM2:0.004:351.5|S1:0.013:119.8|M1:0.004:225.9|J1:0.007:201.3|SA:0.072:140.4|RHO:0.003:188.9|Q1:0.011:192.3|T2:0.011:17.9|R2:0.003:212.7|P1:0.025:180.2|2SM2:0.002:35.9|M3:0.009:44.7|L2:0.015:355.8|2MK3:0.013:11.5|K2:0.033:29.4|M8:0.002:102|MS4:0.021:137.9"

sensor:
  - platform: tide
    tide_id: my_tide
    type: current_height
    name: "Tide Current Height"
    id: tide_current
  - platform: tide
    tide_id: my_tide
    type: tide_percentage
    name: "Tide Percentage"
    id: tide_percentage
  - platform: tide
    tide_id: my_tide
    type: high_level
    name: "High Tide Level"
    id: high_tide_level
  - platform: tide
    tide_id: my_tide
    type: low_level
    name: "Low Tide Level"
    id: low_tide_level
  - platform: tide
    tide_id: my_tide
    type: mean_high_water
    name: "Mean High Water"
  - platform: tide
    tide_id: my_tide
    type: mean_low_water
    name: "Mean Low Water"

text_sensor:
  - platform: tide
    tide_id: my_tide
    type: high_time
    name: "High Tide Time"
    id: high_tide_time_sensor
  - platform: tide
    tide_id: my_tide
    type: low_time
    name: "Low Tide Time"
    id: low_tide_time_sensor

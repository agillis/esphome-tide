        - label: { align: TOP_LEFT, x: 93, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "2AM" }
        - label: { align: TOP_LEFT, x: 141, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "4AM" }
        - label: { align: TOP_LEFT, x: 190, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "6AM" }
        - label: { align: TOP_LEFT, x: 239, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "8AM" }
        - label: { align: TOP_LEFT, x: 285, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "10AM" }
        - label: { align: TOP_LEFT, x: 335, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "12PM" }
        - label: { align: TOP_LEFT, x: 386, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "2PM" }
        - label: { align: TOP_LEFT, x: 434, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "4PM" }
        - label: { align: TOP_LEFT, x: 483, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "6PM" }
        - label: { align: TOP_LEFT, x: 532, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "8PM" }
        - label: { align: TOP_LEFT, x: 578, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "10PM" }
        - label: { align: TOP_LEFT, x: 629, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "12AM" }
        - label: { align: TOP_LEFT, x: 680, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "2AM" }
        - label: { align: TOP_LEFT, x: 728, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "4AM" }
        - label: { align: TOP_LEFT, x: 777, y: 430, text_font: font_axis, text_color: 0x8A99A8, text: "6AM" }

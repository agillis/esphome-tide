        - label: { id: xlbl19, align: TOP_LEFT, x: 0, y: 430, text_font: font_axis, text_color: 0x8A99A8, hidden: true, text: "" }

        # "now" time badge — repositioned onto the red line each redraw
        - label:
            id: now_badge
            align: TOP_LEFT
            x: 56
            y: 194
            text_font: font_badge
            text_color: 0xFFFFFF
            bg_color: 0x7A1416
            bg_opa: COVER
            radius: 5
            pad_left: 7
            pad_right: 7
            pad_top: 4
            pad_bottom: 4
            text: "--:--"
